<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detection using Watson NLP</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="card mt-4">
            <div class="card-body">
                <h1 class="center-heading">NLP - Emotion Detection</h1>
                <p class="text-muted">
                    Analyse customer feedback with the IBM Watson NLP emotion workflow
                    (anger, disgust, fear, joy, sadness).
                </p>

                <div class="form-group">
                    <label class="form-label" for="textToAnalyze">Please enter the text to be analyzed</label>
                    <textarea class="form-control" id="textToAnalyze" rows="4" maxlength="1000"
                              placeholder="I am so happy with this purchase!"></textarea>
                    <small class="form-text text-muted">
                        Up to 1000 characters. Blank input is rejected with HTTP 400.
                    </small>
                </div>

                <button type="button" id="detectButton" class="btn btn-primary">
                    Run Emotion Detection
                </button>

                <h2 class="mt-4 mb-3">
                    <label class="form-label">Result of Emotion Detection</label>
                </h2>
                <div id="system_response" class="result-panel"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
